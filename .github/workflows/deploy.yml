name: Build & Deploy (PHP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - name: arkturian.com
            host_secret: DEPLOY_HOST
            deploy_path: /var/www/admin.arkturian.com
            url: https://admin.arkturian.com
          - name: arkserver.arkturian.com
            host_secret: DEPLOY_HOST_ARKSERVER
            deploy_path: /var/www/admin.arkserver.arkturian.com
            url: https://admin.arkserver.arkturian.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PHP files
        run: |
          echo "✅ PHP project - validating files"
          ls -la *.php 2>/dev/null | head -10 || echo "No PHP files in root"
          find . -name "*.php" -not -path "./vendor/*" | head -10

      - name: Deploy to ${{ matrix.server.name }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            REPO_PATH="/var/code/admin-panel"
            DEPLOY_PATH="${{ matrix.server.deploy_path }}"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="admin-panel"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "📂 Repository: $REPO_PATH"
            echo "🎯 Deploy to: $DEPLOY_PATH"
            echo "🌐 Server: ${{ matrix.server.name }}"

            cd "$REPO_PATH"

            echo "🔧 Cleaning up git repository..."
            git gc --prune=now

            echo "🔄 Fetching latest code..."
            git fetch origin --prune
            git reset --hard origin/main

            echo "✅ PHP project - no dependencies to install"

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying PHP files..."
            mkdir -p "$DEPLOY_PATH"
            rsync -av --delete \
              --exclude='.git' \
              --exclude='.devops' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='*.md' \
              "$REPO_PATH/" "$DEPLOY_PATH/"

            echo "🔒 Setting permissions..."
            chown -R www-data:www-data "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"

            # Make writable directories if they exist
            for dir in logs cache uploads tmp; do
              if [ -d "$DEPLOY_PATH/$dir" ]; then
                chmod -R 775 "$DEPLOY_PATH/$dir"
              fi
            done

            echo "✅ Deployment completed successfully!"
            echo "📁 Live at: ${{ matrix.server.url }}"
            echo "💾 Backup: $BACKUP_PATH"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful to ${{ matrix.server.name }}!"
          echo "📍 Site: ${{ matrix.server.url }}"
          echo "📦 Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed for ${{ matrix.server.name }}"
          echo "📦 Commit: ${{ github.sha }}"
          echo "Check logs above for details"

