name: Build & Deploy (PHP)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_arkturian:
        description: 'Deploy to arkturian.com'
        type: boolean
        default: true
      deploy_arkserver:
        description: 'Deploy to arkserver.arkturian.com'
        type: boolean
        default: true
      deploy_aiserver:
        description: 'Deploy to aiserver.oneal.eu'
        type: boolean
        default: true

jobs:
  # ============================================================================
  # PRODUCTION: arkturian.com
  # ============================================================================
  deploy-arkturian:
    name: Deploy to arkturian.com
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_arkturian)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://admin.arkturian.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PHP files
        run: |
          echo "✅ PHP project - validating files"
          ls -la *.php 2>/dev/null | head -10 || echo "No PHP files in root"

      - name: Deploy to arkturian.com
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: TARGET_SHA
          script: |
            set -e

            REPO_PATH="/var/code/admin-panel"
            DEPLOY_PATH="/var/www/admin.arkturian.com"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="admin-panel"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "📂 Repository: $REPO_PATH"
            echo "🎯 Deploy to: $DEPLOY_PATH"
            echo "🎯 Target SHA: $TARGET_SHA"

            cd "$REPO_PATH"

            echo "🔧 Cleaning up git repository..."
            git gc --prune=now
            git clean -fd --exclude=.env

            echo "🔄 Fetching code, waiting for SHA $TARGET_SHA to land..."
            for i in $(seq 1 15); do
              git fetch origin --prune --quiet || true
              if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
                echo "✓ Commit $TARGET_SHA visible after $i fetch attempt(s)"
                git checkout -f main 2>/dev/null || true
                git reset --hard "$TARGET_SHA"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Commit $TARGET_SHA never appeared after 15 attempts (~45s)"
                echo "Current origin/main: $(git rev-parse origin/main 2>&1)"
                git log --oneline origin/main -3 || true
                exit 1
              fi
              sleep 3
            done

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying PHP files..."
            mkdir -p "$DEPLOY_PATH"
            rsync -av --delete \
              --exclude='.git' \
              --exclude='.devops' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='*.md' \
              "$REPO_PATH/" "$DEPLOY_PATH/"

            echo "🔒 Setting permissions..."
            chown -R www-data:www-data "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"

            for dir in logs cache uploads tmp; do
              if [ -d "$DEPLOY_PATH/$dir" ]; then
                chmod -R 775 "$DEPLOY_PATH/$dir"
              fi
            done

            echo "✅ Deployment completed successfully!"
            echo "📁 Live at: https://admin.arkturian.com"

  # ============================================================================
  # STAGING: arkserver.arkturian.com
  # ============================================================================
  deploy-arkserver:
    name: Deploy to arkserver.arkturian.com
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_arkserver)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://admin.arkserver.arkturian.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to arkserver.arkturian.com
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST_ARKSERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: TARGET_SHA
          script: |
            set -e

            REPO_PATH="/var/code/admin-panel"
            DEPLOY_PATH="/var/www/admin.arkserver.arkturian.com"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="admin-panel"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "📂 Repository: $REPO_PATH"
            echo "🎯 Deploy to: $DEPLOY_PATH"
            echo "🎯 Target SHA: $TARGET_SHA"

            cd "$REPO_PATH"

            echo "🔧 Cleaning up git repository..."
            git gc --prune=now
            git clean -fd --exclude=.env

            echo "🔄 Fetching code, waiting for SHA $TARGET_SHA to land..."
            for i in $(seq 1 15); do
              git fetch origin --prune --quiet || true
              if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
                echo "✓ Commit $TARGET_SHA visible after $i fetch attempt(s)"
                git checkout -f main 2>/dev/null || true
                git reset --hard "$TARGET_SHA"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Commit $TARGET_SHA never appeared after 15 attempts (~45s)"
                echo "Current origin/main: $(git rev-parse origin/main 2>&1)"
                git log --oneline origin/main -3 || true
                exit 1
              fi
              sleep 3
            done

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying PHP files..."
            mkdir -p "$DEPLOY_PATH"
            rsync -av --delete \
              --exclude='.git' \
              --exclude='.devops' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='*.md' \
              "$REPO_PATH/" "$DEPLOY_PATH/"

            echo "🔒 Setting permissions..."
            chown -R www-data:www-data "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"

            for dir in logs cache uploads tmp; do
              if [ -d "$DEPLOY_PATH/$dir" ]; then
                chmod -R 775 "$DEPLOY_PATH/$dir"
              fi
            done

            echo "✅ Deployment completed successfully!"
            echo "📁 Live at: https://admin.arkserver.arkturian.com"

  # ============================================================================
  # PDREI: pdrei.arkturian.com (jascha) — PHP-FPM stack
  # ============================================================================
  deploy-pdrei:
    name: Deploy to pdrei.arkturian.com
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: pdrei
      url: https://admin.pdrei.arkturian.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to pdrei
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PDREI_DEPLOY_HOST }}
          username: ${{ secrets.PDREI_DEPLOY_USER }}
          key: ${{ secrets.PDREI_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: TARGET_SHA
          script: |
            set -e

            REPO_PATH="/var/code/admin-panel"
            DEPLOY_PATH="/var/www/admin"
            REPO_URL="https://github.com/apopovic77/admin-panel.git"
            DOMAIN="admin.pdrei.arkturian.com"

            echo "🎯 Target SHA: $TARGET_SHA"

            # Init git repo if not present
            sudo mkdir -p "$REPO_PATH"
            sudo chown -R jascha:jascha "$REPO_PATH"

            if [ ! -d "$REPO_PATH/.git" ]; then
              echo "📥 Initial clone..."
              cd "$REPO_PATH"
              git init
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
            fi

            cd "$REPO_PATH"
            echo "🔄 Fetching code, waiting for SHA $TARGET_SHA to land..."
            for i in $(seq 1 15); do
              git fetch origin main --quiet || true
              if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
                echo "✓ Commit $TARGET_SHA visible after $i fetch attempt(s)"
                git reset --hard "$TARGET_SHA"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Commit $TARGET_SHA never appeared after 15 attempts (~45s)"
                exit 1
              fi
              sleep 3
            done

            # Sync to deploy path with rsync
            echo "🚀 Deploying PHP files..."
            sudo mkdir -p "$DEPLOY_PATH"
            sudo rsync -av --delete \
              --exclude='.git' \
              --exclude='.devops' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='*.md' \
              "$REPO_PATH/" "$DEPLOY_PATH/"

            sudo chown -R www-data:www-data "$DEPLOY_PATH"
            sudo chmod -R 755 "$DEPLOY_PATH"
            for dir in logs cache uploads tmp; do
              if [ -d "$DEPLOY_PATH/$dir" ]; then
                sudo chmod -R 775 "$DEPLOY_PATH/$dir"
              fi
            done

            # Always (re)write nginx vhost with PHP-FPM + SSL
            echo "🌐 Writing nginx vhost..."
            CERT_PATH="/etc/letsencrypt/live/mcp.pdrei.arkturian.com"
            if ! sudo test -d "$CERT_PATH"; then
              echo "ERROR: SSL cert not found at $CERT_PATH"
              exit 1
            fi

            # Detect PHP-FPM socket dynamically
            PHP_SOCK=$(ls /run/php/php*-fpm.sock 2>/dev/null | head -1)
            if [ -z "$PHP_SOCK" ]; then
              echo "ERROR: PHP-FPM socket not found"
              exit 1
            fi
            echo "Using PHP socket: $PHP_SOCK"

            sudo tee /etc/nginx/sites-available/${DOMAIN} > /dev/null <<NGINX
            server {
                listen 80;
                server_name ${DOMAIN};
                return 301 https://\$host\$request_uri;
            }

            server {
                listen 443 ssl http2;
                server_name ${DOMAIN};

                ssl_certificate ${CERT_PATH}/fullchain.pem;
                ssl_certificate_key ${CERT_PATH}/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                root ${DEPLOY_PATH};
                index index.php index.html;

                client_max_body_size 100M;

                location / {
                    try_files \$uri \$uri/ /index.php?\$query_string;
                }

                location ~ \\.php\$ {
                    include snippets/fastcgi-php.conf;
                    fastcgi_pass unix:${PHP_SOCK};
                    fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                    fastcgi_read_timeout 300;
                }

                # Deny access to sensitive files
                location ~ /\\.(?!well-known) {
                    deny all;
                }
            }
            NGINX
            sudo ln -sf /etc/nginx/sites-available/${DOMAIN} /etc/nginx/sites-enabled/${DOMAIN}
            sudo nginx -t && sudo systemctl reload nginx

            # Verify
            if curl -sf -o /dev/null https://${DOMAIN}/ ; then
              echo "✅ admin.pdrei.arkturian.com is up"
            else
              echo "⚠️  HTTPS check inconclusive (might require auth)"
            fi

            echo "📁 Live at: https://${DOMAIN}"

  # ============================================================================
  # O'NEAL: aiserver.oneal.eu (via arkturian.com jump host)
  # ============================================================================
  deploy-aiserver:
    name: Deploy to aiserver.oneal.eu
    if: |
      vars.ENABLE_AISERVER_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_aiserver)
    runs-on: ubuntu-latest
    environment:
      name: oneal
      url: https://gsgbot.arkturian.com/admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via arkturian.com jump host
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: TARGET_SHA
          script: |
            set -euo pipefail
            echo "=== Deploying admin-panel to aiserver.oneal.eu via jump host ==="
            echo "🎯 Target SHA: $TARGET_SHA"

            # SSH to aiserver and deploy via git. TARGET_SHA is forwarded
            # explicitly because the inner heredoc is single-quoted.
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/oneal_aiserver gsgbot@aiserver.oneal.eu "TARGET_SHA='$TARGET_SHA' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            DEPLOY_PATH="/var/code/admin-panel"

            echo "=== Updating repository (waiting for $TARGET_SHA) ==="
            cd "$DEPLOY_PATH"
            git clean -fd --exclude=.env
            for i in $(seq 1 15); do
              git fetch origin --prune --quiet || true
              if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
                echo "✓ Commit $TARGET_SHA visible after $i fetch attempt(s)"
                git checkout -f main 2>/dev/null || true
                git reset --hard "$TARGET_SHA"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Commit $TARGET_SHA never appeared after 15 attempts (~45s)"
                exit 1
              fi
              sleep 3
            done

            echo "=== Setting permissions ==="
            chmod -R 755 "$DEPLOY_PATH"

            echo "=== Deployment complete ==="
            echo "📁 Live at: https://gsgbot.arkturian.com/admin"
            DEPLOY_SCRIPT
